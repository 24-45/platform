<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00A79D"/>
      <stop offset="100%" style="stop-color:#008C84"/>
    </linearGradient>
  </defs>
  
  <!-- Icon - stylized community symbol -->
  <g transform="translate(10, 10)">
    <!-- Central circle -->
    <circle cx="50" cy="50" r="45" fill="url(#tealGrad)" opacity="0.2"/>
    <circle cx="50" cy="50" r="35" fill="none" stroke="#00A79D" stroke-width="2"/>
    
    <!-- People icons -->
    <circle cx="50" cy="35" r="8" fill="#00A79D"/>
    <path d="M35 65 Q50 50 65 65" fill="none" stroke="#00A79D" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Community circles -->
    <circle cx="30" cy="55" r="6" fill="#E31B23"/>
    <circle cx="70" cy="55" r="6" fill="#B8860B"/>
    <circle cx="50" cy="70" r="6" fill="#00A79D"/>
  </g>
  
  <!-- Arabic Text -->
  <text x="120" y="45" font-family="Tajawal, Arial" font-size="24" font-weight="700" fill="#FFFFFF">
    هيئة تنمية المجتمع
  </text>
  <text x="120" y="75" font-family="Tajawal, Arial" font-size="18" font-weight="400" fill="#B8860B">
    Community Development Authority
  </text>
  <text x="120" y="100" font-family="Tajawal, Arial" font-size="14" font-weight="300" fill="rgba(255,255,255,0.7)">
    حكومة دبي
  </text>
</svg>
