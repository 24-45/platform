<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقرير الرصد والتحليل الإعلامي الاستراتيجي | وزارة الرياضة والشباب - قطر</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========================================
         الشريحة 1: الغلاف
         ======================================== -->
    <section class="slide slide-cover" id="slide-1">
        
        <!-- العناصر الزخرفية - الزاوية العلوية اليمنى -->
        <div class="decor-corner decor-corner--top-right">
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M200 0H0V200C0 89.543 89.543 0 200 0Z" fill="#8A1538" fill-opacity="0.08"/>
                <path d="M200 0H50V150C50 72.157 112.157 10 190 10H200V0Z" fill="#8A1538" fill-opacity="0.05"/>
                <circle cx="180" cy="20" r="3" fill="#D4AF37"/>
                <circle cx="160" cy="40" r="2" fill="#D4AF37" fill-opacity="0.6"/>
                <circle cx="140" cy="60" r="2" fill="#D4AF37" fill-opacity="0.4"/>
                <path d="M200 0L150 50" stroke="#8A1538" stroke-width="0.5" stroke-opacity="0.2"/>
                <path d="M200 30L170 60" stroke="#8A1538" stroke-width="0.5" stroke-opacity="0.2"/>
            </svg>
        </div>
        
        <!-- العناصر الزخرفية - الزاوية السفلية اليسرى -->
        <div class="decor-corner decor-corner--bottom-left">
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M200 0H0V200C0 89.543 89.543 0 200 0Z" fill="#8A1538" fill-opacity="0.08"/>
                <path d="M200 0H50V150C50 72.157 112.157 10 190 10H200V0Z" fill="#8A1538" fill-opacity="0.05"/>
                <circle cx="180" cy="20" r="3" fill="#D4AF37"/>
                <circle cx="160" cy="40" r="2" fill="#D4AF37" fill-opacity="0.6"/>
                <circle cx="140" cy="60" r="2" fill="#D4AF37" fill-opacity="0.4"/>
                <path d="M200 0L150 50" stroke="#8A1538" stroke-width="0.5" stroke-opacity="0.2"/>
                <path d="M200 30L170 60" stroke="#8A1538" stroke-width="0.5" stroke-opacity="0.2"/>
            </svg>
        </div>
        
        <!-- الترويسة - الشعارات -->
        <header class="cover-header">
            <!-- شعار وزارة الرياضة والشباب -->
            <div class="logo-container">
                <div class="logo-placeholder">
                    <span>شعار<br>الوزارة</span>
                </div>
                <div class="logo-text">
                    وزارة الرياضة والشباب<br>
                    <small style="font-weight: 400; color: var(--text-medium);">دولة قطر</small>
                </div>
            </div>
            
            <!-- شعار رؤية قطر 2030 -->
            <div class="logo-container">
                <div class="logo-text" style="text-align: left;">
                    رؤية قطر الوطنية<br>
                    <small style="font-weight: 400; color: var(--text-medium);">Qatar National Vision</small>
                </div>
                <div class="logo-placeholder" style="background: linear-gradient(135deg, #2C3E50 0%, #1a252f 100%);">
                    <span>2030</span>
                </div>
            </div>
        </header>
        
        <!-- المحتوى الرئيسي -->
        <div class="slide-content">
            <div class="cover-main">
                <!-- خط زخرفي علوي -->
                <div class="decor-line"></div>
                
                <!-- العنوان الرئيسي -->
                <h1 class="cover-title">
                    تقرير الرصد والتحليل الإعلامي الاستراتيجي
                </h1>
                
                <!-- العنوان الفرعي -->
                <p class="cover-subtitle">
                    قياس كفاءة الأداء الإعلامي وتعزيز السمعة المؤسسية
                </p>
                
                <!-- خط زخرفي سفلي -->
                <div class="decor-line"></div>
                
                <!-- صندوق فترة الرصد -->
                <div class="cover-period">
                    <span class="cover-period-icon">📅</span>
                    <span>فترة الرصد: 21 أكتوبر 2025 – 19 يناير 2026</span>
                </div>
            </div>
        </div>
        
        <!-- التذييل -->
        <footer class="cover-footer">
            <div>
                <strong style="color: var(--maroon-primary);">سري وخاص</strong> | للاستخدام الداخلي فقط
            </div>
            <div>
                إعداد: إدارة الإعلام والاتصال المؤسسي
            </div>
        </footer>
        
    </section>

    <!-- ========================================
         الشرائح التالية ستضاف هنا
         ======================================== -->
