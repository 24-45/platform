<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ project_name }} | قريباً - 24°45°</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00D46A;
            --bg-dark: #0A0A0A;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-pattern::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 212, 106, 0.08) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(5%, 10%); }
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 600px;
        }

        .logo {
            height: 60px;
            filter: brightness(0) invert(1);
            margin-bottom: 40px;
        }

        .icon-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 212, 106, 0.2) 0%, rgba(0, 212, 106, 0.05) 100%);
            border: 2px solid rgba(0, 212, 106, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .icon-container i {
            font-size: 60px;
            color: var(--primary);
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        h1 span {
            color: var(--primary);
        }

        .subtitle {
            font-size: 20px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .project-name {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: rgba(0, 212, 106, 0.1);
            border: 1px solid rgba(0, 212, 106, 0.3);
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 40px;
        }

        .back-btn {
            padding: 16px 40px;
            background: linear-gradient(135deg, #00D46A 0%, #00B85A 100%);
            color: #000;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 212, 106, 0.3);
        }

        .footer {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="content">
        <img src="/static/images/24.png" alt="24°45°" class="logo">
        
        <div class="icon-container">
            <i class="fas fa-rocket"></i>
        </div>
        
        <h1>قريباً <span>جداً</span></h1>
        
        <p class="subtitle">
            نعمل بجد على إعداد هذا المشروع ليكون جاهزاً قريباً.
            <br>ترقبوا الإطلاق!
        </p>
        
        <div class="project-name">
            <i class="fas fa-building"></i>
            {{ project_name }}
        </div>
        
        <br><br>
        
        <a href="/Project" class="back-btn">
            <i class="fas fa-arrow-right"></i>
            العودة للمشاريع
        </a>
    </div>
    
    <div class="footer">
        © 2025 جميع الحقوق محفوظة لـ 24°45°
    </div>
</body>
</html>
